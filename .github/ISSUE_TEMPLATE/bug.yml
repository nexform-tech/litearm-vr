name: Bug report
description: Report something that is broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Write in English.
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What were you doing, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduce
      description: Minimal steps, commands, and environment.
    validations:
      required: true

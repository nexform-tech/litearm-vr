# Component tests and a manual bundle build.
#
# The required check is the aggregate `test` job. It is the only check branch
# protection needs; the component jobs can be renamed or extended without
# changing the required check.
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Bundle version for the manual package job (x.y.z)"
        required: false
        default: "0.0.0-dev"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: litearm-vr-bridge/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./litearm-vr-bridge[dev]"

      - name: Test
        run: bash scripts/ci.sh bridge

  teleop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install test dependencies
        run: pip install numpy scipy pyyaml websockets eclipse-zenoh pybullet

      - name: Test
        run: bash scripts/ci.sh teleop

  follow:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Test
        run: bash scripts/ci.sh follow

  standards:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check
        run: bash scripts/check-repo.sh

  package:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Normalize version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "value=${INPUT_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build bundle
        run: bash packaging/build-bundle.sh "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: litearm-vr-bundle-${{ steps.version.outputs.value }}
          path: packaging/out/${{ steps.version.outputs.value }}/
          if-no-files-found: error

  test:
    name: test
    needs: [bridge, teleop, follow, standards]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Check required jobs
        run: |
          results="${{ needs.bridge.result }} ${{ needs.teleop.result }} ${{ needs.follow.result }} ${{ needs.standards.result }}"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "a required job failed: $results"
              false
            fi
          done
          echo "all required jobs passed"
